data_cfg:
  dataset_name: CCGR-3D
  dataset_root: /7T/zsndata3/CCGR_3D/2D
  dataset_partition: ./datasets/CCGR-3D/CCGR-3D.json
  test_dataset_name: CCGR-3D
  num_workers: 1
  data_in_use: pose
  remove_no_gallery: false

evaluator_cfg:
  enable_float16: false
  restore_ckpt_strict: true
  restore_hint: 2000
  save_name: GaitGraph2_CCGR_3D
  sampler:
    batch_size: 4
    frames_num_fixed: 60
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_ordered
    frames_skip_num: 0
  metric: cos
  eval_func: evaluate_CCGR_3D
  transform:
    - type: GaitGraphMultiInput

loss_cfg:
  - loss_term_weight: 1
    temperature: 0.01
    type:  SupConLoss_Lp
    log_prefix: SupConLoss

model_cfg:
  model: GaitGraph2
  joint_format: coco
  input_num: 3
  reduction: 8
  block: Bottleneck # Basic, initial
  input_branch:
    - 5
    - 64
    - 32
  main_stream:
    - 32
    - 128
    - 256
  num_class: 115
  tta: true

optimizer_cfg:
  lr: 0.005 #0.005
  solver: AdamW
  weight_decay: 0.00001

scheduler_cfg:
  max_lr: 0.005
  total_steps: 2000
  scheduler: OneCycleLR

trainer_cfg:
  enable_float16: false
  log_iter: 20
  with_test: false
  restore_ckpt_strict: false
  restore_hint: 0
  save_iter: 200
  save_name: GaitGraph2_CCGR_3D
  sync_BN: true
  total_iter: 2000
  sampler:
    batch_shuffle: true
    frames_num_fixed: 60
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_ordered #Repeat sample
    frames_skip_num: 0
    batch_size: 768  # 256 only for debug #
    type: CommonSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: FlipSequence
          probability: 0.5
        - type: InversePosesPre
          probability: 0.1
        - type:  JointNoise
          std: 0.25
        - type: PointNoise
          std: 0.05
        - type: RandomMove
          random_r:
                    - 4
                    - 1
        - type: GaitGraphMultiInput
