data_cfg:
  dataset_name: CCGR-3D
  dataset_root: /7T/zsndata3/CCGR_3D/2D
  dataset_partition: ./datasets/CCGR-3D/CCGR-3D.json
  num_workers: 1
  data_in_use: par
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: CCGR-3D

evaluator_cfg:
  enable_float16: false
  restore_ckpt_strict: true
  restore_hint: 50000
  save_name: GaitSet_PAR
  eval_func: evaluate_CCGR_3D
  sampler:
    batch_size: 4
    sample_type: all_ordered
    type: InferenceSampler
  metric: euc # cos

loss_cfg:
  loss_term_weight: 1.0
  margin: 0.2
  type: TripletLoss
  log_prefix: triplet

model_cfg:
  model: GaitSet
  in_channels:
    - 1
    - 64
    - 128
    - 256
  SeparateFCs:
    in_channels: 256
    out_channels: 256
    parts_num: 62
  bin_num:
    - 16
    - 8
    - 4
    - 2
    - 1

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones
    - 20000
    - 30000
    - 40000
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true
  fix_BN: false
  with_test: false
  log_iter: 100
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 10000
  save_name: GaitSet_PAR
  sync_BN: false
  total_iter: 50000
  sampler:
    batch_shuffle: false
    batch_size:
      - 8
      - 8
    frames_num_fixed: 30
    frames_num_max: 50
    frames_num_min: 25
    sample_type: fixed_unordered
    type: TripletSampler